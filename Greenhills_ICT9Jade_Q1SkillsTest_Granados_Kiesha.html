<!DOCTYPE html>
<html>
    <head>
        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link href="https://fonts.googleapis.com/css2?family=Lato:ital,wght@0,100;0,300;0,400;0,700;0,900;1,100;1,300;1,400;1,700;1,900&display=swap" rel="stylesheet">
        <link rel="stylesheet" href="styles_Q1SkillsTest.css">
        <title>Q1 Skills Test</title>
    </head>
    <body>
        <div class="wrapper">
            <img src="https://play-lh.googleusercontent.com/OwiIxkQhT3F-zukYQJGQKTDaJrj0ub-gku-nn2vEOszKWHMLa87D060lRIVZxQYMzAjRpAHb4wM8Iix9Tn_gfA">

            <h1><u>OBMC Robotics Club<br>Application Form</u></h1>  

            <h3>Welcome! Please fill out this form to apply for our school's Robotics Club.</h3>

            <form>
            <label><b>Full Name:</b></label><br>
            <input type="text" class="Name"><br>

            <label><b>Gmail:</b></label><br>
            <input type="text" class="Gmail"><br>

            <label><b>Grade Level:</b></label><br>
            <select class="Gradelvl-group">
                <option value="7">Grade 7</option>
                <option value="8">Grade 8</option>
                <option value="9">Grade 9</option>
                <option value="10">Grade 10</option>
            </select><br>

            <label><b>Gender:</b></label>
                <input type="radio" name="Gender" value="Male">
                <label for="#">Male</label>
                 <input type="radio" name="Gender" value="Female">
                <label for="#">Female</label>

            <div class="Skills-group">
            <label><b>What are your skills?</b></label><br>
                <input type="checkbox">
                <label>Coding</label>
                <input type="checkbox">
                <label>Design</label>
                <input type="checkbox">
                <label>Electronics</label>
            </div><br>

            <label><b>Tell us why you want to join:</b></label><br>
            <textarea name="Reason" cols="30" rows="5"></textarea>
            </form>

            <label>Top Robotics Activties We Offer:</label>
             <ul>
               <li>Line Following Robots</li>
               <li>Obstacle Avoidance Programming</li>
               <li>Light Following Robot</li>
            </ul>

            <div class="btn-group">
                <button type="submit" class="btn submit">Submit Application</button>
            </div>
        </div>
    </body>
</html>
